[package]
name = "poni"
version = "0.1.0"
edition = "2021"
description = "A small native notch/pill island for Windows."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
